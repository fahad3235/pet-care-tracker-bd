<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Care Tracker BD</title>
<meta name="description" content="Offline bilingual pet care tracker: feedings, vaccinations, vet visits and weight.">
<style>
  :root { --bg:#f7f4ee; --card:#ffffff; --ink:#1e2a22; --muted:#6b7a6f; --line:#e3ddd0;
    --green:#1f7a4d; --green-soft:#e3f2e8; --amber:#b45309; --amber-soft:#fef3c7;
    --red:#b91c1c; --red-soft:#fee2e2; --blue:#1d4ed8; --blue-soft:#dbeafe; --radius:14px; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  header { background:#16351f; color:#fff; padding:18px 16px 14px; }
  header .wrap { max-width:1080px; margin:0 auto; display:flex; gap:12px; align-items:flex-start; justify-content:space-between; }
  header h1 { margin:0; font-size:1.6rem; }
  header p { margin:4px 0 0; opacity:.85; font-size:.95rem; }
  #langBtn { background:#fff; color:#16351f; border:0; border-radius:999px; padding:8px 16px; font-weight:700; cursor:pointer; flex-shrink:0; }
  nav { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  nav .wrap { max-width:1080px; margin:0 auto; display:flex; gap:4px; overflow-x:auto; padding:0 8px; }
  nav button { background:none; border:0; border-bottom:3px solid transparent; padding:12px 14px; font-size:.95rem; font-weight:600; cursor:pointer; color:var(--muted); white-space:nowrap; }
  nav button.active { color:var(--green); border-bottom-color:var(--green); }
  main { max-width:1080px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 10px; font-size:1.15rem; }
  .card h3 { margin:18px 0 8px; font-size:1rem; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
  .stat .num { font-size:1.7rem; font-weight:800; line-height:1.1; }
  .stat .lbl { color:var(--muted); font-size:.85rem; }
  .stat.warn .num { color:var(--red); }
  .stat.warn { border-color:#fecaca; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  label { display:block; font-weight:600; font-size:.9rem; margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:10px 12px; border:1px solid #cbd5cf; border-radius:10px; font:inherit; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--green); outline-offset:1px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > * { flex:1 1 140px; }
  .btn { background:var(--green); color:#fff; border:0; border-radius:10px; padding:10px 18px; font-weight:700; cursor:pointer; }
  .btn:hover { filter:brightness(1.08); }
  .btn.secondary { background:#e8efe9; color:var(--ink); }
  .btn.danger { background:var(--red); }
  .btn.small { padding:6px 12px; font-size:.85rem; }
  .err { color:var(--red); font-size:.85rem; margin-top:4px; min-height:1.1em; }
  .err:empty { display:none; }
  .ok { color:var(--green); font-size:.9rem; margin-top:8px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .empty { color:var(--muted); padding:14px 0; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-size:.82rem; text-transform:uppercase; letter-spacing:.03em; }
  .table-wrap { overflow-x:auto; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.78rem; font-weight:700; }
  .badge.overdue { background:var(--red-soft); color:var(--red); }
  .badge.due-today { background:var(--amber-soft); color:var(--amber); }
  .badge.due-soon { background:var(--amber-soft); color:var(--amber); }
  .badge.up-to-date { background:var(--green-soft); color:var(--green); }
  .badge.no-due { background:#eee; color:var(--muted); }
  .pet-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .pet-card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
  .pet-card h3 { margin:0 0 4px; }
  .pet-card .meta { color:var(--muted); font-size:.88rem; }
  .pet-card .actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .filter-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .filter-row label { margin:0; }
  .filter-row select { width:auto; min-width:160px; }
  footer { max-width:1080px; margin:0 auto; padding:8px 16px 32px; color:var(--muted); font-size:.85rem; }
  .hidden { display:none !important; }
  .chart-wrap { width:100%; overflow-x:auto; }
  svg text { font-size:11px; fill:var(--muted); }
  @media (max-width:640px) {
    .stats { grid-template-columns:repeat(2,1fr); }
    .grid2 { grid-template-columns:1fr; }
    header h1 { font-size:1.3rem; }
    .row > * { flex:1 1 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1 data-i18n="appTitle">Pet Care Tracker</h1>
      <p data-i18n="appSubtitle"></p>
    </div>
    <button id="langBtn" type="button" data-i18n="langBtn">Bangla</button>
  </div>
</header>
<nav aria-label="Sections">
  <div class="wrap" id="tabs">
    <button type="button" data-tab="dashboard" class="active" data-i18n="tabDashboard"></button>
    <button type="button" data-tab="pets" data-i18n="tabPets"></button>
    <button type="button" data-tab="feeding" data-i18n="tabFeeding"></button>
    <button type="button" data-tab="vaccines" data-i18n="tabVaccines"></button>
    <button type="button" data-tab="visits" data-i18n="tabVisits"></button>
    <button type="button" data-tab="weight" data-i18n="tabWeight"></button>
    <button type="button" data-tab="data" data-i18n="tabData"></button>
  </div>
</nav>
<main>
  <section id="tab-dashboard"></section>
  <section id="tab-pets" class="hidden"></section>
  <section id="tab-feeding" class="hidden"></section>
  <section id="tab-vaccines" class="hidden"></section>
  <section id="tab-visits" class="hidden"></section>
  <section id="tab-weight" class="hidden"></section>
  <section id="tab-data" class="hidden"></section>
</main>
<footer><p data-i18n="footer"></p><p class="muted" data-i18n="emptyStateHint"></p></footer>
<script src="js/logic.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
